spring.application.name=sns-timeline
server.port=8080

# ===== DB =====
# 接続情報は application-local.properties(ローカル)または環境変数(AWS)で渡す
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Hibernateがテーブルを作った後に schema.sql を実行する(大文字小文字を区別しない一意インデックスの作成)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===== ヘルスチェック(/api/health) =====
management.endpoints.web.base-path=/api
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health

# ===== JWT =====
# 署名キーは32バイト以上。Gitにはコミットせず、環境変数 JWT_SECRET または application-local.properties で渡す
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=24h

# ===== 画像のアップロード(画像投稿機能 処理のルール No.6) =====
# 画面のチェックを通さずにAPIを直接呼ばれた場合に備え、サーバー側でも上限を設定する(超えたら413)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
# 上限を超えたリクエストでも、本文を読み切ってから413を返す(途中で接続を切ると、画面に413が届かないため)
server.tomcat.max-swallow-size=25MB
# フェーズ1(ローカル)の画像の保存先(backend/ からの相対パス。.gitignore 済み)と、画面に返すURLの先頭
app.storage.local-dir=uploads
app.storage.public-base-url=http://localhost:8080/uploads

# ===== API仕様書(springdoc-openapi、設計書 4-4) =====
# 本番(AWS)では公開しない。ローカルでは application-local.properties で true にする
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# GlobalExceptionHandler のエラーを全APIに一律で付けず、各APIの @ApiResponse に書いたものだけを載せる
springdoc.override-with-generic-response=false
# レスポンスは常にJSON。multipart のAPIでは @RequestParam をクエリではなくフォームのパートとして載せる
springdoc.default-produces-media-type=application/json
springdoc.default-support-form-data=true
# 生成した yaml の並び順を毎回同じにする(docs/api/openapi.yaml の差分チェックのため)
springdoc.writer-with-order-by-keys=true
# Swagger UI で入力したJWTを、ページを読み込み直しても残す
springdoc.swagger-ui.persist-authorization=true

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173
