# E2Eテスト(設計書 7-6、e2e/README.md)用の設定。local の後ろに付けて起動する(後に書いたプロファイルが優先される):
#   ./gradlew.bat bootRun --args='--spring.profiles.active=local,e2e'
# 普段は e2e/ で npx playwright test を実行すると、Playwright がこのプロファイルでバックエンドを起動する。
# DBのユーザー名・パスワードとJWTの署名キーは application-local.properties の値をそのまま使う。
# 接続先だけ、E2E専用のDB(e2e/docker-compose.e2e.yml、ポート5434)に切り替える。
# GitHub Actions(.github/workflows/ci.yml)では application-local.properties が無いため e2e だけで起動し、
# ユーザー名・パスワード・署名キーは環境変数(SPRING_DATASOURCE_USERNAME・SPRING_DATASOURCE_PASSWORD・JWT_SECRET)で渡す。

spring.datasource.url=jdbc:postgresql://localhost:5434/sns_timeline_e2e

# E2Eテストで投稿した画像を、開発用の backend/uploads/ と混ぜない
app.storage.local-dir=build/e2e-uploads
