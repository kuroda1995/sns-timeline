# 性能テスト(設計書 7-5)用の設定。local の後ろに付けて起動する(後に書いたプロファイルが優先される):
#   ./gradlew.bat bootRun --args='--spring.profiles.active=local,perf'
# DBのユーザー名・パスワードとJWTの署名キーは application-local.properties の値をそのまま使う。
# 接続先だけ、性能テスト専用のDB(perf/docker-compose.perf.yml、ポート5433)に切り替える。

spring.datasource.url=jdbc:postgresql://localhost:5433/sns_timeline_perf

# 性能テストで投稿した画像を、開発用の backend/uploads/ と混ぜない
app.storage.local-dir=build/perf-uploads

# JVM・DB接続プールの状態を見られるようにする(例: /api/metrics/hikaricp.connections.pending)。
# 本番(aws)では health だけを公開する。ログインが必要なので Authorization ヘッダーを付けて取得する
management.endpoints.web.exposure.include=health,metrics
