# AWS(フェーズ2)用の設定。ECS のタスク定義で環境変数 SPRING_PROFILES_ACTIVE=aws にして有効にする
# 秘密情報(DBのパスワード・JWT署名キー)はここに書かず、SSM Parameter Store から環境変数で渡す(infra/ecs.tf)

# ===== DB =====
# 接続先は環境変数で渡す(SPRING_DATASOURCE_URL・SPRING_DATASOURCE_USERNAME・SPRING_DATASOURCE_PASSWORD)

# ===== 画像の保存先(設計書 5章) =====
# 非公開の S3 バケットに保存し、画面には有効期限1時間の署名付きURLを返す(S3ImageStorage)
app.storage.type=s3
app.storage.s3-bucket=${IMAGE_BUCKET}
app.storage.url-expiration=1h

# ===== CORS =====
# CloudFront が画面と API を同じURLで配信するため、ブラウザからは同じオリジンになり CORS は使われない。
# 念のため CloudFront のURLだけを許可する
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===== ログ(設計書 8章) =====
# 1行1件の JSON(ECS形式)で出力する。CloudWatch Logs Insights で項目を指定して検索・集計できる
logging.structured.format.console=ecs
