plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	// 静的解析(設計書 7-7)。./gradlew check で、テストと一緒に実行される
	id 'checkstyle'
	id 'pmd'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// API仕様書(OpenAPI)の自動生成と Swagger UI(設計書 4-4)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	// 画像の保存先を S3 にする(フェーズ2、S3ImageStorage)
	implementation platform('software.amazon.awssdk:bom:2.57.2')
	implementation 'software.amazon.awssdk:s3'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Repository・API結合テスト用に、使い捨ての PostgreSQL を Docker で起動する(設計書 7)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ===== 静的解析(設計書 7-7) =====
// 実行: ./gradlew lint(静的解析だけ。Docker 不要で数十秒) / ./gradlew check(静的解析 + テスト)

// コンパイラの警告(非推奨APIの使用・型の安全でない変換など)も、見逃さないようにエラーにする。
// processing はアノテーションプロセッサが無いことの通知なので除く
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Werror']
}

checkstyle {
	toolVersion = '14.3.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	// 警告も1件でもあれば失敗にする
	maxWarnings = 0
}

pmd {
	toolVersion = '7.28.0'
	ruleSetFiles = files('config/pmd/ruleset.xml')
	// 既定のルールセットは使わず、config/pmd/ruleset.xml のルールだけを使う
	ruleSets = []
	consoleOutput = true
}

tasks.register('lint') {
	group = 'verification'
	description = '静的解析(コンパイラの警告・Checkstyle・PMD)だけを実行する'
	dependsOn 'checkstyleMain', 'checkstyleTest', 'pmdMain', 'pmdTest'
}

tasks.named('test') {
	useJUnitPlatform()
	// OpenApiDocTest: -PupdateApiDoc を付けると docs/api/openapi.yaml を書き換え、付けなければ差分をチェックする
	def updateApiDoc = project.hasProperty('updateApiDoc')
	systemProperty 'updateApiDoc', updateApiDoc
	inputs.property('updateApiDoc', updateApiDoc)
	// yaml だけを手で書き換えた場合も、テストを実行し直して差分に気づけるようにする
	inputs.files('../docs/api/openapi.yaml').withPropertyName('openApiDoc').optional()
}
