# PRごと・main への push ごとに、次をすべて自動で実行する(設計書 7-4・7-7)。性能テストは対象外(perf.yml を手動で実行する)
#   バックエンド: 静的解析(コンパイラの警告・Checkstyle・PMD) / 単体・結合テスト(API仕様書の差分チェックを含む)
#   フロントエンド: Lint(oxlint) / 単体・コンポーネントテスト / ビルド / APIの型の差分チェック
#   E2E: Lint / Playwright による E2E テスト
# 最後の「CI 結果」ジョブで全部の結果をまとめる。ブランチ保護の必須チェックにはこのジョブを指定する
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Actions の画面から手動でも実行できるようにする(「Run workflow」)
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止めて新しいものだけを実行する(main への push は止めない)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    name: バックエンド(静的解析)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # --continue: Checkstyle で指摘があっても PMD まで実行し、全部の指摘を一度に出す
      - name: 静的解析(コンパイラの警告・Checkstyle・PMD)
        run: ./gradlew lint --continue
      - name: 静的解析のレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-lint-report
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/pmd/

  backend-test:
    # Repository・API結合テストは Testcontainers で PostgreSQL を起動する(ubuntu-latest には Docker が入っている)
    name: バックエンド(単体・結合テスト・API仕様書の差分チェック)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # OpenApiDocTest が、コミット済みの docs/api/openapi.yaml と実装から生成した結果を比べる
      - name: テスト
        run: ./gradlew test
      - name: テストの件数をジョブのサマリーに出す
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          files=(build/test-results/test/*.xml)
          [ ${#files[@]} -gt 0 ] || exit 0
          sum() { grep -ho "<testsuite [^>]*" "${files[@]}" | grep -o " $1=\"[0-9]*\"" | grep -o "[0-9]*" | awk '{ s += $1 } END { print s + 0 }'; }
          {
            echo "## バックエンドのテスト"
            echo
            echo "| 実行 | 失敗 | エラー | スキップ |"
            echo "|---|---|---|---|"
            echo "| $(sum tests) | $(sum failures) | $(sum errors) | $(sum skipped) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: テストレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  frontend:
    name: フロントエンド(Lint・テスト・ビルド・APIの型の差分チェック)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: install
        run: npm ci
      # Lint で指摘があっても、テスト・ビルドまで実行して全部の問題を一度に出す(どれかが失敗すればジョブは失敗)
      - name: Lint(oxlint。警告も失敗にする)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: 単体・コンポーネントテスト
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: ビルド
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: APIの型(src/api/schema.d.ts)が openapi.yaml と一致しているか
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts が古いままです。frontend で npm run gen:api-types を実行し、差分をコミットしてください"
            exit 1
          }
      - name: API仕様書(HTML)を作る
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:api-doc
      - name: API仕様書(HTML)を保存
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-doc
          path: docs/api/dist/index.html

  # 実際のブラウザ(Chromium)・バックエンド・DBをつないで、画面の操作の流れを確かめる(設計書 7-6、e2e/README.md)。
  # バックエンドと画面は Playwright が起動する(e2e/support/servers.js)
  e2e:
    name: E2Eテスト(Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 画面の依存関係を入れる
        run: npm ci
        working-directory: frontend
      - run: npm ci
      - name: Lint(oxlint。警告も失敗にする)
        run: npm run lint
      - name: Playwright のブラウザ(Chromium)を入れる
        run: npx playwright install --with-deps chromium

      # DBのパスワードとJWTの署名キーは、実行のたびにランダムに作る(リポジトリにも Secrets にも置かない)
      - name: 使い捨ての秘密情報を作る
        run: |
          db_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -base64 48)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "POSTGRES_PASSWORD=$db_password" > "$RUNNER_TEMP/e2e.env"
          echo "SPRING_DATASOURCE_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - name: E2E専用DBを起動する
        run: docker compose --env-file "$RUNNER_TEMP/e2e.env" -f docker-compose.e2e.yml up -d --wait

      # CI には application-local.properties が無いため、e2e プロファイルだけで起動し、
      # DBのユーザー名・パスワードとJWTの署名キーは環境変数で渡す
      - name: E2Eテスト
        env:
          E2E_BACKEND_PROFILES: e2e
          SPRING_DATASOURCE_USERNAME: sns_timeline
        run: npx playwright test
      - name: レポート(失敗した操作のトレース・スクリーンショット・動画)を保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # 上のジョブが1つでも失敗・キャンセル・スキップされたら失敗にする。
  # ジョブを追加・改名しても、ブランチ保護の必須チェックはこの1つを指定しておけばよい
  result:
    name: CI 結果
    if: always()
    needs: [backend-lint, backend-test, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: すべてのジョブが成功したか
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::成功しなかったジョブがあります: $failed"
            exit 1
          fi
