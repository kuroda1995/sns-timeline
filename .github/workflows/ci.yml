# PRごとにテスト・Lint・ビルドと、API仕様書(docs/api/openapi.yaml)が実装と一致しているかを確認する(設計書 4-4)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    # Repository・API結合テストは Testcontainers で PostgreSQL を起動する(ubuntu-latest には Docker が入っている)
    name: バックエンド(テスト・API仕様書の差分チェック)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # OpenApiDocTest が、コミット済みの docs/api/openapi.yaml と実装から生成した結果を比べる
      - name: テスト
        run: ./gradlew test
      - name: テストレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  frontend:
    name: フロントエンド(Lint・ビルド・APIの型の差分チェック)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: テスト
        run: npm test
      - name: ビルド
        run: npm run build
      - name: APIの型(src/api/schema.d.ts)が openapi.yaml と一致しているか
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts が古いままです。frontend で npm run gen:api-types を実行し、差分をコミットしてください"
            exit 1
          }
      - name: API仕様書(HTML)を作る
        run: npm run build:api-doc
      - name: API仕様書(HTML)を保存
        uses: actions/upload-artifact@v7
        with:
          name: api-doc
          path: docs/api/dist/index.html

  # 実際のブラウザ(Chromium)・バックエンド・DBをつないで、画面の操作の流れを確かめる(設計書 7-6、e2e/README.md)。
  # バックエンドと画面は Playwright が起動する(e2e/support/servers.js)
  e2e:
    name: E2Eテスト(Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 画面の依存関係を入れる
        run: npm ci
        working-directory: frontend
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Playwright のブラウザ(Chromium)を入れる
        run: npx playwright install --with-deps chromium

      # DBのパスワードとJWTの署名キーは、実行のたびにランダムに作る(リポジトリにも Secrets にも置かない)
      - name: 使い捨ての秘密情報を作る
        run: |
          db_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -base64 48)
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "POSTGRES_PASSWORD=$db_password" > "$RUNNER_TEMP/e2e.env"
          echo "SPRING_DATASOURCE_PASSWORD=$db_password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
      - name: E2E専用DBを起動する
        run: docker compose --env-file "$RUNNER_TEMP/e2e.env" -f docker-compose.e2e.yml up -d --wait

      # CI には application-local.properties が無いため、e2e プロファイルだけで起動し、
      # DBのユーザー名・パスワードとJWTの署名キーは環境変数で渡す
      - name: E2Eテスト
        env:
          E2E_BACKEND_PROFILES: e2e
          SPRING_DATASOURCE_USERNAME: sns_timeline
        run: npx playwright test
      - name: レポート(失敗した操作のトレース・スクリーンショット・動画)を保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
